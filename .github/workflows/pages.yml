name: Product introduction page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'scripts/prepare-site.mjs', 'public/life-cockpit.svg', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.16.0'
      - run: node scripts/prepare-site.mjs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .runtime/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
